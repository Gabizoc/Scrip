# nginx/scrip.conf
# Copier vers /etc/nginx/sites-available/scrip
# Puis : ln -s /etc/nginx/sites-available/scrip /etc/nginx/sites-enabled/scrip
# Recharger : nginx -t && systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name scrip.gabizoc.fr;

    ssl_certificate     /etc/letsencrypt/live/scrip.gabizoc.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scrip.gabizoc.fr/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # ── Frontend React (Vite build) ───────────────────────────────────────────
    root /home/scrip/app/frontend/dist;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long sur les assets hashés par Vite (main-a1b2c3.js, etc.)
    location ~* \.(js|css|png|jpg|jpeg|webp|woff2|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend API ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Nécessaire pour les cookies de session (httpOnly secure)
        proxy_set_header   Cookie            $http_cookie;

        # Timeout long pour le pipeline IA
        proxy_read_timeout 120s;

        client_max_body_size 20m;
    }

    # ── WebDAV (sync Obsidian) ────────────────────────────────────────────────
    location /webdav/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Toutes les méthodes WebDAV (PROPFIND, MKCOL, COPY, MOVE…)
        proxy_pass_request_headers on;

        client_max_body_size 50m;
    }
}

# ── Redirection HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    server_name scrip.gabizoc.fr;
    return 301 https://$host$request_uri;
}
